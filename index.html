<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bible Questions</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bible Qs" />
<meta name="theme-color" content="#4f46e5" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="app-header">
  <h1>📖 Bible Questions</h1>
  <div id="connection-status" class="status-pill" hidden></div>
</header>

<nav class="tabs" id="tabs"></nav>

<main id="app">
  <section id="setup-banner" class="banner" hidden>
    <p><strong>Almost there!</strong> This app needs a free Firebase project so everyone's questions stay in sync.
    Open <code>firebase-config.js</code> and paste in your project's config. See <code>README.md</code> for
    step-by-step instructions.</p>
  </section>

  <section id="random-card" class="random-card" hidden>
    <div class="random-label" id="random-label">Question for <span id="random-person"></span></div>
    <p class="random-text" id="random-text"></p>
    <div class="random-actions">
      <button id="random-next-btn" class="btn btn-primary">🎲 Another question</button>
    </div>
  </section>

  <div class="list-toolbar">
    <h2 id="list-title">Questions</h2>
    <button id="add-question-btn" class="btn btn-primary">+ Add Question</button>
  </div>

  <ul id="question-list" class="question-list"></ul>
  <p id="empty-state" class="empty-state" hidden>No questions here yet.</p>
</main>

<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal">
    <h3 id="modal-title">Add Question</h3>
    <label for="modal-text">Question</label>
    <textarea id="modal-text" rows="4" placeholder="e.g. Who built the ark?"></textarea>

    <label for="modal-assign">Assign to</label>
    <select id="modal-assign"></select>

    <div class="modal-actions">
      <button id="modal-cancel-btn" class="btn">Cancel</button>
      <button id="modal-save-btn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
